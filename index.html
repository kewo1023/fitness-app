<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover: deja que la app pinte debajo de la barra de
         estado y de la barra de gestos. A cambio, TODA pantalla tiene que
         respetar var(--sat) arriba y var(--sab) abajo, o el contenido
         queda tapado. Ver la regla 7 de CLAUDE.md. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Pinta la barra de estado de Android del color de la app.
         Un solo valor: lo actualiza src/lib/tema.js leyendo la variable
         --fondo de theme.css. Antes eran dos etiquetas con media query,
         y eso dejó de servir cuando apareció el botón: si el sistema
         está en oscuro y el usuario elige claro, la media query seguiría
         pintando la barra oscura sobre una app clara.

         ESTE ES EL ÚNICO COLOR LITERAL FUERA DE theme.css EN TODO EL
         PROYECTO, y no se puede evitar: es el valor de arranque, y en
         ese instante la hoja de estilos todavía no se ha leído, así que
         no hay ninguna variable de la cual sacarlo. Dura milisegundos:
         apenas carga theme.css, tema.js lo reemplaza por --fondo. Si
         algún día cambia el fondo del tema claro, hay que cambiarlo
         aquí también. -->
    <meta name="theme-color" content="#FFFFFF" />

    <!-- ===============================================================
         LO QUE CONVIERTE ESTO EN UNA APP INSTALABLE.

         Hasta el 3/09 no existía ninguna de estas tres líneas, y esa
         era la razón de un bug que solo se veía en Android: al
         "agregar a pantalla de inicio", Chrome creaba un MARCADOR —un
         atajo que abre el navegador con su barra de direcciones— en
         vez de instalar la app. En el iPhone no pasaba, y eso despistó:
         Safari abre sus atajos sin barra tenga o no manifest, así que
         parecía que la app estaba bien y el problema era de Android.
         Era al revés. El público de esta app es 83% Android.

         El manifest es lo que le dice al sistema el nombre, el icono,
         el color y que se abra SIN navegador (display: standalone).
         =============================================================== -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS no lee los iconos del manifest para la pantalla de inicio:
         usa esta etiqueta suya. Y el título de aquí es el que sale
         debajo del icono, que si no sería el <title> entero. -->
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Entrena" />

    <!-- El de la pestaña del navegador. Sin esto el navegador pide
         /favicon.ico, no lo encuentra, y deja un 404 en cada carga. -->
    <link rel="icon" href="/iconos/icono-192.png" type="image/png" />

    <!-- ===============================================================
         POR QUÉ ESTE SCRIPT ESTÁ AQUÍ SUELTO Y NO EN UN ARCHIVO.

         Tiene que correr ANTES de que el navegador pinte el primer
         pixel. Un módulo de /src carga después de los estilos, así que
         para cuando pudiera actuar la pantalla ya se pintó clara: el
         usuario vería un fogonazo blanco y medio segundo después la app
         oscura. Eso es el "flash" que se ve en tantas webs al abrirlas
         de noche, y molesta justo a quien eligió el tema oscuro.

         Es la única lógica duplicada del proyecto, y es a propósito. La
         versión completa, comentada, está en src/lib/tema.js.
         =============================================================== -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('tema') } catch (e) { /* incógnito */ }
        if (t !== 'claro' && t !== 'oscuro') {
          t = (window.matchMedia &&
               window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'oscuro' : 'claro'
        }
        document.documentElement.dataset.tema = t
      })()
    </script>

    <title>Entrena</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
